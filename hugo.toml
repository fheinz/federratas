baseURL = 'https://federratas.me/'
locale = 'es'
title = 'Federratas'
theme = 'congo'
defaultContentLanguage = "es"
removePathAccents = true

[languages]
  [languages.es]
    label = "Español"
    weight = 1
    [languages.es.params]
      description = "Sitio personal de Federico Heinz"
    [languages.es.params.author]
      headline = "Amateur profesional de amplio espectro."
      bio = "Amateur profesional de amplio espectro."

  [languages.en]
    label = "English"
    weight = 2
    [languages.en.params]
      description = "Federico Heinz's personal website."
    [languages.en.params.author]
      headline = "Broad-spectrum professional amateur."
      bio = "Broad-spectrum professional amateur."

  [languages.de]
    label = "Deutsch"
    weight = 3
    [languages.de.params]
      description = "Persönliche Website von Federico Heinz."
    [languages.de.params.author]
      headline = "Breitbandberufsamateur."
      bio = "Breitbandberufsamateur."

# Generates a standard robots.txt file automatically
enableRobotsTXT = true 

[params]
  env = 'production'
  # This sets the global meta description for SEO
  description = 'Un catálogo de pruebas y errores. Sobre todo errores.'
  
  # Congo's default visual settings
  colorScheme = 'default'
  defaultAppearance = 'light'

[params.author]
  name = "Fede Heinz"
  # image = "avatar.jpg"

[params.homepage]
  layout = "page"
  showRecent = true

[params.list]
  showSummary = true

[[languages.es.menu.main]]
  name = "Language"
  weight = 100
  [languages.es.menu.main.params]
    action = "locale"

